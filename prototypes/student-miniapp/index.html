<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f1">
<title>CampusAI · 学生端</title>
<style>
:root {
  color-scheme: light;
  --page: #edeae2;
  --paper: rgba(255, 254, 251, .84);
  --ink: #24231f;
  --muted: #6f6a61;
  --line: #26221820;
  --gold: #9d8555;
  --gold-dark: #644f2c;
  --gold-wash: #efe9db;
  --red: #8d3a32;
  --green: #346047;
  --gutter: 16px;
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  /* Phone layout uses logical pixels. Text stays the same from 320px to 430px. */
  --text-body: .875rem;
  --text-ui: .8125rem;
  --text-small: .75rem;
  --text-caption: .6875rem;
  --text-item: .9375rem;
  --text-section: 1rem;
  --text-title: 1.25rem;
  font-family: var(--font);
  color: var(--ink);
  background: var(--page);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  font-size: var(--text-body);
  display: grid; place-items: center; padding: 18px;
  background:
    radial-gradient(ellipse at 24% 12%, #f8f6f0, transparent 60%),
    radial-gradient(ellipse at 78% 68%, #d7cbbc82, transparent 58%),
    linear-gradient(135deg, #edeae1, #dedbd0);
}
.miniapp-shell {
  display: flex; flex-direction: column; overflow: hidden; position: relative;
  width: min(100%, 393px); height: min(852px, calc(100vh - 36px));
  height: min(852px, calc(100dvh - 36px)); border: 1px solid #fff9;
  border-radius: 25px; box-shadow: 0 24px 60px #45362c1b, 0 3px 12px #49382512;
  background-color: #f7f4ed;
  backdrop-filter: blur(28px) saturate(.88);
}
.miniapp-shell::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
  background-image: radial-gradient(circle, #755b3709 .45px, transparent .75px);
  background-size: 3px 3px;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid #806b43; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.25; }
p, .copy { line-height: 1.65; }
.muted { color: var(--muted); }
.small { font-size: var(--text-small); }
.label { font-size: var(--text-ui); font-weight: 600; }
.top { flex: none; background: #fdfbf7b8; border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
.top-inner {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center; gap: 4px; min-height: 46px;
  padding: calc(3px + env(safe-area-inset-top)) var(--gutter) 3px;
}
.brand { display: inline-flex; align-items: center; justify-self: start; min-width: 42px; min-height: 42px; }
.back-mark { display: grid; place-items: center; width: 32px; height: 44px; font-size: 1.5rem; line-height: 1; }
.miniapp-title { text-align: center; min-width: 0; }
.brand-title { display: block; font-size: var(--text-item); font-weight: 760; line-height: 1.2; letter-spacing: -.03em; }
.mode-label { display: block; margin-top: 2px; font-size: var(--text-caption); color: var(--gold-dark); line-height: 1.2; }
.mode-label.live { color: var(--green); }
.top-actions { justify-self: end; }
.top-actions .btn { white-space: nowrap; padding-inline: 0; border: 0; font-size: var(--text-small); }
.nav-leading { display: flex; align-items: center; gap: 5px; min-width: 0; }
.nav-leading .brand { min-width: 30px; }
.nav-leading .back-mark { width: 27px; }
.avatar {
  display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; overflow: hidden;
  padding: 0; border: 1px solid var(--line); border-radius: 50%;
  background: #e8dfcc; color: var(--ink); font-size: var(--text-body); font-weight: 700;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.large { width: 52px; height: 52px; font-size: var(--text-section); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none; width: fit-content;
  border-radius: 4px; padding: 4px 7px; line-height: 1.25; font-size: var(--text-caption);
  font-weight: 600; color: #554520; background: var(--gold-wash);
}
.chip.live { color: #30523d; background: #e9f0e8; }
.btn {
  display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px;
  padding: 9px 16px; border: 1px solid var(--ink); border-radius: 6px; background: var(--ink);
  color: #fffaf0; font-size: var(--text-body); font-weight: 650; line-height: 1.35;
}
.btn:hover { background: #35312a; }
.btn.outline { color: var(--ink); border-color: var(--line); background: transparent; }
.btn.outline:hover { background: #ede9e1; }
.btn.soft { color: #584826; border-color: var(--line); background: #f7f3e9; }
.btn.soft:hover { background: #eee4ce; }
.btn.compact { min-height: 36px; padding: 6px 12px; font-size: var(--text-ui); }
.wrap {
  flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto;
  padding: 8px var(--gutter) calc(20px + env(safe-area-inset-bottom));
  scrollbar-width: thin; scrollbar-color: #5e4c3540 transparent;
}
.todo-panel {
  padding: 0 0 12px; border-bottom: 1px solid var(--line);
}
.todo-panel:has(#todo-content[hidden]) { padding-bottom: 4px; }
.section-title .small { white-space: nowrap; font-variant-numeric: tabular-nums; }
.section-toggle { display: inline-flex; align-items: center; gap: 7px; flex: none; white-space: nowrap; }
.section-toggle.small-action { min-height: 44px; }
.collapse-chevron { width: 7px; height: 7px; border-right: 1px solid; border-bottom: 1px solid; transform: translateY(2px) rotate(225deg); }
.section-toggle[aria-expanded="false"] .collapse-chevron { transform: translateY(-2px) rotate(45deg); }
.todo-progress { display: block; width: 100%; height: 2px; margin: 0 0 2px; border: 0; appearance: none; background: var(--line); color: var(--gold); }
.todo-progress::-webkit-progress-bar { background: var(--line); }
.todo-progress::-webkit-progress-value { background: var(--gold); }
.todo-progress::-moz-progress-bar { background: var(--gold); }
.todo-list { margin: 0 0 10px; }
.todo-row {
  display: flex; align-items: center;
  border-bottom: 1px solid var(--line);
}
.todo-row label { display: flex; align-items: center; flex: 1 1 0%; min-width: 0; min-height: 46px; padding: 6px 4px 6px 0; }
.todo-row label span { min-width: 0; margin-left: 8px; font-size: var(--text-body); line-height: 1.45; overflow-wrap: anywhere; }
.todo-row input { width: 16px; height: 16px; margin: 0; accent-color: var(--gold-dark); flex: none; }
.todo-row:has(input:checked) label span { color: var(--muted); text-decoration: line-through; }
.todo-actions { display: flex; flex: none; align-items: center; }
.todo-actions .small-action { min-height: 44px; width: 30px; padding: 0; white-space: nowrap; }
.todo-actions .small-action:last-child { width: 40px; }
.todo-actions .small-action:disabled { opacity: .27; }
.todo-editor-actions { display: flex; align-items: center; gap: 12px; }
.todo-editor-actions .small-action { color: var(--red); }
.todo-form { display: flex; align-items: center; gap: 8px; }
.todo-form .field { flex: 1 1 0%; width: 0; min-width: 0; min-height: 40px; padding: 8px 10px; background: #ffffff59; }
.todo-form .btn { flex: none; white-space: nowrap; }
.small-action {
  min-height: 32px; padding: 5px 7px; border: 0; border-radius: 6px;
  background: transparent; color: var(--gold-dark); font-size: var(--text-small); font-weight: 640;
}
.small-action:hover { background: var(--gold-wash); }
.catalog { margin-top: 6px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.section-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.section-title :is(h1, h2) { font-size: var(--text-section); letter-spacing: -.025em; }
#home-title { font-size: var(--text-body); white-space: nowrap; }
.field {
  display: block; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--paper); line-height: 1.45;
}
.field::placeholder { color: #777069; }
.catalog-tools { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.field.search, .field.drawer-search {
  min-height: 40px;
  padding: 8px 10px;
  border-color: #958a7b;
  background-color: #fff;
  font-size: var(--text-ui);
  appearance: none;
}
.search { width: 136px; max-width: 52%; }
.field.drawer-search { margin-bottom: 8px; }
.course-list { display: grid; }
.course {
  display: flex; align-items: center;
  min-height: 68px; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line);
}
.course:hover, .course:focus-visible { background: #fff9; }
.course-mark { display: block; background: var(--gold-dark); }
.course .course-mark { flex: none; width: 4px; height: 25px; margin-right: 10px; }
.course-code {
  display: inline-block; color: var(--gold-dark);
  font-size: var(--text-caption); font-weight: 670; letter-spacing: .075em; font-variant-numeric: tabular-nums;
}
.course-copy { flex: 1 1 0%; min-width: 0; margin-right: 10px; }
.course-copy h3 { font-size: var(--text-item); letter-spacing: -.025em; }
.course-copy p { color: var(--muted); font-size: var(--text-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.course-foot {
  display: flex; align-items: center; gap: 7px; color: var(--muted); margin-top: 3px;
}
.row-arrow { display: block; flex: none; width: 6px; height: 6px; border-top: 1px solid; border-right: 1px solid; transform: rotate(45deg); color: var(--muted); }
.course-head {
  display: flex; align-items: flex-start; gap: 10px; padding: 6px 0 12px;
}
.course-head .course-mark { flex: none; width: 4px; height: 28px; margin-top: 6px; }
.course-head-copy { min-width: 0; }
.course-head h1 { margin-top: 3px; font-size: var(--text-title); letter-spacing: -.035em; overflow-wrap: anywhere; }
.course-head p { margin-top: 4px; color: var(--muted); font-size: var(--text-small); }
.tabs {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  position: sticky; top: 0; z-index: 1; margin: 0 0 12px; border-bottom: 1px solid var(--line);
  background: #fbf9f3d9; backdrop-filter: blur(17px);
}
.tab {
  position: relative; display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap;
  min-height: 44px; padding: 6px 0; color: var(--muted); font-size: var(--text-ui); font-weight: 650;
}
.tab:hover { background: #ffffff65; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 730; }
.tab[aria-current="page"]::after { content: ""; position: absolute; bottom: -1px; width: 2.65em; height: 2px; background: var(--ink); }
.course-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.panel {
  min-width: 0; padding: 0 0 11px; border-bottom: 1px solid var(--line);
}
.panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 9px; margin-bottom: 11px; }
.panel-head h2 { font-size: var(--text-section); letter-spacing: -.025em; }
.panel-note { margin: -3px 0 16px; color: var(--muted); font-size: var(--text-ui); }
.course-summary { line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.material-list { display: grid; }
.material {
  display: flex; align-items: center;
  border-top: 1px solid var(--line);
}
.material-link {
  display: flex; flex: 1 1 0%; align-items: center; min-width: 0; min-height: 58px;
  padding: 7px 5px 7px 0; border: 0; background: transparent; text-align: left;
}
.material-link:hover { background: #fff9; }
.material-copy { flex: 1 1 0%; min-width: 0; margin-right: 6px; }
.material-link strong, .material-link small { display: block; overflow-wrap: anywhere; }
.material-link strong { font-size: var(--text-body); font-weight: 680; line-height: 1.42; }
.material-link small { margin-top: 2px; color: var(--muted); font-size: var(--text-small); }
.file-type {
  display: grid; place-items: center; flex: none; width: 33px; height: 30px; margin-right: 8px; border-radius: 4px; background: var(--gold-wash);
  color: var(--gold-dark); font-size: .625rem; font-weight: 750;
}
.material-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.material-actions .btn { min-height: 38px; padding: 5px 10px; font-size: var(--text-small); }
.row-actions { display: flex; flex: none; align-items: center; }
.row-actions .small-action { min-height: 44px; width: 38px; padding: 0; }
.row-actions .favorite { width: 34px; font-size: 1rem; line-height: 1; }
.favorite[aria-pressed="true"] { color: var(--gold-dark); }
.material-actions .favorite[aria-pressed="true"] { background: var(--gold-wash); }
.personal-panel { display: grid; gap: 8px; }
.personal-heading { margin: 0; }
.empty-note { font-size: var(--text-ui); color: var(--muted); }
.notice { padding: 17px; border-radius: 10px; background: #f4f1e9; color: #514638; }
.notice.error { background: #f9efec; color: var(--red); }
.notice .btn { margin-top: 10px; }
.chat-log { flex: 1 1 auto; min-height: 0; display: grid; align-content: start; gap: 10px; overflow-y: auto; padding: 2px; scroll-padding: 8px; }
.message { width: fit-content; max-width: 100%; padding: 10px 11px; border-radius: 8px; overflow-wrap: anywhere; }
.message.assistant { border-top-left-radius: 4px; background: #fbfaf7; }
.message.user { margin-left: auto; border-top-right-radius: 4px; background: var(--gold-wash); }
.message .copy, .excerpt { white-space: pre-wrap; overflow-wrap: anywhere; }
.message-title { margin-bottom: 5px; font-size: var(--text-small); font-weight: 650; color: var(--muted); }
.sources { display: grid; gap: 6px; margin-top: 10px; }
.source-row {
  display: grid; gap: 6px;
  padding: 8px 9px; background: #f0ece2; border-left: 2px solid var(--gold); border-radius: 0 4px 4px 0;
}
.source-row div { min-width: 0; overflow-wrap: anywhere; }
.source-actions, .chat-tools { display: flex; gap: 5px; flex-wrap: wrap; }
.source-actions .btn { min-height: 30px; padding: 4px 7px; font-size: var(--text-small); }
.source-text { white-space: pre-wrap; padding: 7px; border-radius: 5px; background: #fffb; }
.composer { display: flex; gap: 9px; align-items: end; margin-top: 15px; }
.composer .field { flex: 1 1 auto; min-width: 0; resize: vertical; }
.composer .btn { flex: none; white-space: nowrap; }
.suggestions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.wrap.has-assistant, .reader-body { padding-bottom: calc(77px + env(safe-area-inset-bottom)); }
.float-ask {
  position: absolute; z-index: 5; right: var(--gutter); bottom: max(15px, env(safe-area-inset-bottom));
  gap: 7px; min-height: 44px; padding: 7px 12px; font-size: var(--text-ui); border-radius: 24px; border: 1px solid #eee1c4;
  box-shadow: 0 6px 22px #33261542; white-space: nowrap;
}
.float-ask span { display: grid; place-items: center; width: 21px; height: 18px; border: 1px solid #fff9; border-radius: 7px 7px 7px 2px; font-size: .75rem; }
.float-chat {
  position: absolute; z-index: 6; display: flex; flex-direction: column; gap: 8px;
  right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: min(365px, calc(100% - 24px));
  height: min(56%, 430px); min-height: min(248px, 70%); padding: 12px;
  border: 1px solid #fff; border-radius: 13px; background: #fdfbf6f5;
  box-shadow: 0 8px 28px #2b201d32; backdrop-filter: blur(22px);
}
.float-chat .panel-head { flex: none; flex-wrap: nowrap; gap: 6px; margin: 0; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.float-chat h2 { font-size: var(--text-item); }
.float-chat .composer { flex: none; margin: 0; }
.float-chat .composer textarea { max-height: 82px; resize: none; }
.float-chat .suggestions { margin: 0; }
.float-chat .notice { flex: none; padding: 7px 9px; font-size: var(--text-ui); }
.chat-context { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reader {
  position: absolute; z-index: 3; inset: 0; display: flex; flex-direction: column;
  background: linear-gradient(148deg, #fdfbf6, #f0ebe0); color: var(--ink);
}
.reader-head {
  flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) var(--gutter) 10px; border-bottom: 1px solid var(--line);
  background: #fdfaf5b8; backdrop-filter: blur(16px);
}
.reader-head h2 { font-size: var(--text-item); overflow-wrap: anywhere; }
.reader-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px var(--gutter) calc(77px + env(safe-area-inset-bottom)); }
.miniapp-shell:has(.float-chat:not([hidden])) :is(.reader-body, .wrap.has-assistant) {
  padding-bottom: calc(min(56dvh, 430px) + 25px + env(safe-area-inset-bottom));
}
.reader-body .material-actions { margin: 8px 0 13px; }
.reader-preview { display: grid; gap: 10px; }
.reader-preview .excerpt { margin: 0; padding: 14px 0; border-top: 1px solid var(--line); font-size: var(--text-item); line-height: 1.7; }
.page-navigation { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.page-image { display: block; width: 100%; height: auto; background: white; border: 1px solid #fff; border-radius: 6px; }
.reader-frame { display: block; width: 100%; height: min(52dvh, 500px); border: 0; border-radius: 8px; background: white; }
.preview-page { padding: 13px; border: 1px solid #fff; border-radius: 9px; background: var(--paper); overflow: auto; }
.preview-page h3 { margin-bottom: 6px; }
.preview-page table { border-collapse: collapse; font-size: var(--text-ui); }
.preview-page td { border: 1px solid var(--line); padding: 5px 8px; min-width: 3ch; vertical-align: top; }
.reader-highlight { border-radius: 4px; padding-inline: 2px; background: #efe0ac; }
.form { display: grid; gap: 13px; }
.form label { display: grid; gap: 6px; font-weight: 600; }
.form textarea { resize: vertical; min-height: 116px; }
.form .btn { justify-self: start; }
.form-status { font-size: var(--text-ui); color: var(--red); }
.form-status:empty { display: none; }
.history { display: grid; gap: 9px; margin-top: 20px; }
.history-item { border-top: 1px solid var(--line); padding: 10px 0; overflow-wrap: anywhere; }
.profile-drawer {
  position: fixed; inset: 0 auto 0 max(0px, calc(50vw - 196.5px)); margin: auto 0;
  width: min(74vw, 291px); max-width: none; height: min(852px, calc(100dvh - 36px)); max-height: none;
  padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; color: var(--ink); border: 1px solid #fff9; border-radius: 25px 13px 13px 25px;
  background: linear-gradient(160deg, #fcf9f1fb, #f4efe4f5);
  backdrop-filter: blur(22px); box-shadow: 9px 0 26px #49382524;
}
.profile-drawer::backdrop { background: #21170c46; }
.drawer-head { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-bottom: 6px; }
.drawer-head h2 { font-size: var(--text-section); }
.identity { display: flex; align-items: center; gap: 11px; padding: 9px 0 15px; border-bottom: 1px solid var(--line); }
.identity strong { overflow-wrap: anywhere; }
.drawer-menu { display: grid; }
.drawer-link {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 46px; padding: 9px 4px 9px 0; text-align: left; border: 0; border-bottom: 1px solid var(--line);
  font-weight: 650; background: transparent;
}
.drawer-link:hover { background: #fff9; }
.drawer-content { display: grid; gap: 10px; }
.drawer-content .history-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.drawer-content .history-item button { flex: none; }
.form-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.sheet {
  width: min(100% - 26px, 402px); max-height: 84vh; overflow-y: auto; border: 1px solid #fff;
  border-radius: 14px; padding: 18px; background: #fdfbf6f5; color: var(--ink); box-shadow: 0 24px 65px #2f251932;
  backdrop-filter: blur(18px);
}
.sheet::backdrop { background: #1a140e60; }
.sheet h2 { font-size: var(--text-section); overflow-wrap: anywhere; }
.sheet .notice { margin-bottom: 12px; }
.sheet .excerpt { padding: 12px 14px; border-left: 3px solid var(--gold); background: #f8f5ed; line-height: 1.7; margin: 12px 0; }
.entry-file-note { overflow-wrap: anywhere; }
.endpoint-list { margin: 12px 0 4px; padding-left: 20px; line-height: 1.65; color: var(--muted); font-size: var(--text-ui); }
.endpoint-list code { overflow-wrap: anywhere; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }
@media (max-width: 480px) {
  body { padding: 0; }
  .miniapp-shell { width: 100%; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  .sheet {
    width: 100%; margin: auto 0 0; border-radius: 18px 18px 0 0;
    padding-bottom: max(18px, env(safe-area-inset-bottom));
  }
  .profile-drawer { left: 0; height: 100vh; height: 100dvh; padding-top: calc(12px + env(safe-area-inset-top)); border-radius: 0; }
}
@media (max-width: 355px) {
  :root { --gutter: 14px; }

    if (text.length < 8) return { code: 400, msg: '请至少输入 8 个字。' }
    feedbackHistory.unshift({
      owner, courseId: course.id, courseName: course.name, kind, text,
      date: dateLabel(new Date())
    })
    feedbackHistory = feedbackHistory.slice(0, 40)
    try {
      localStorage.setItem('campusai-prototype-feedback-v1', JSON.stringify(feedbackHistory))
      return { code: 200, msg: '已保存本机演示反馈。' }
    } catch {
      return { code: 200, msg: '已保存当前预览会话的演示反馈。' }
    }
  }
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch])
}

function apiPath(course, suffix = '') {
  return '/campusai/courses/' + encodeURIComponent(course.id) + suffix
}

async function api(path, { method = 'GET', body, token = state.session?.token, timeout = 10_000, file = false } = {}) {
  const headers = {}
  if (token) headers.Authorization = 'Bearer ' + token
  if (body) headers['Content-Type'] = 'application/json'
  let response
  try {
    response = await fetch('/api' + path, {
      method, headers, body: body ? JSON.stringify(body) : undefined,
      signal: AbortSignal.timeout(timeout), cache: 'no-store'
    })
  } catch (error) {
    throw new Error(error.name === 'TimeoutError' ? '等待后端响应超时，请重试。' : '无法连接本机后端。')
  }
  const json = response.headers.get('content-type')?.includes('application/json')
  if (file && response.ok && !json) return response.blob()
  const payload = json ? await response.json() : null
  if (!response.ok || payload?.code !== 200) {
    const error = new Error(payload?.msg || '后端响应异常，请检查预览服务。')
    error.code = payload?.code || response.status
    throw error
  }
  if (file) throw new Error('资料下载响应异常。')
  return payload
}

function courseLink(id, tab = 'materials') {
  return '#/course/' + encodeURIComponent(id) + '/' + tab
}

function getCourse() {
  return state.courses.find(course => String(course.id) === state.route.id)
}

function dataFor(course) {
  const id = String(course.id)
  if (!state.courseData.has(id)) {
    state.courseData.set(id, {
      detail: null, detailsPending: false, detailsError: '',
      materials: null, materialsPending: false, materialsError: '',
      chat: [], draft: '', asking: false, chatError: '', sourceView: null,
      feedbackKind: feedbackKinds[0], feedbackText: '', feedbackError: '', feedbackSaved: ''
    })
  }
  return state.courseData.get(id)
}

function route() {
  const match = location.hash.match(/^#\/course\/([1-9]\d*)\/(materials|ask|quiz|feedback)$/)
  const tab = match?.[2]
  const legacyView = tab === 'ask' || tab === 'quiz'
  state.route = match ? { id: match[1], tab: legacyView ? 'materials' : tab } : { id: null, tab: 'materials' }
  if (legacyView) history.replaceState(null, '', courseLink(match[1]))
  if (sheet.open) sheet.close()
  if (drawer.open) drawer.close()
  while (readings.length) discardReading()
  assistantOpen = tab === 'ask'
  renderReader()
  render()
  app.scrollTop = 0
  loadCoursePage()
}

  if (source.paragraphStart != null) {

    return (source.heading ? source.heading + ' · ' : '') + '第 ' + source.paragraphStart + (end && end !== source.paragraphStart ? '–' + end : '') + ' 段'

  return source.heading || '原文片段'

async function loadCoursePage() {
  const course = getCourse()
  const session = state.session
  if (!course || !session) return
  const info = dataFor(course)
  const canRender = () => state.session === session && getCourse()?.id === course.id
  if (!info.detail && !info.detailsError && !info.detailsPending) {
    info.detailsPending = true
    try {
      const detail = await api(apiPath(course))
      if (!detail.data?.name) throw new Error('课程详情返回格式异常。')
      info.detail = detail.data
    } catch (error) {
      info.detailsError = error.message
    } finally {
      info.detailsPending = false
      if (canRender()) render()
    }
  }
  if (canRender() && state.route.tab === 'materials' && !info.materials && !info.materialsError && !info.materialsPending) {
    info.materialsPending = true
    try {
      const result = await api(apiPath(course, '/rag/materials'))
      if (!Array.isArray(result.data)) throw new Error('资料列表返回格式异常。')
      info.materials = result.data
    } catch (error) {
      info.materialsError = error.message
    } finally {
      info.materialsPending = false
      if (canRender() && state.route.tab === 'materials') render()
    }
  }
}

function demoAnswer(course, question) {
  const sample = mockFor(course.courseCode)
  const normalize = value => value.replace(/[\s?？。！!]/g, '')
  if (sample && normalize(question) === normalize(citationPrompt)) {
    const deck = demoMaterials(sample).find(item => item.id === 'pptx')
    const source = { ...deck, location: '', slideNumber: 2, text: '引用定位保留资料名与原文位置，支持核对检索依据。' }
    return { text: '可以用资料名和引用位置找到原课件，再核对那一页是否支持回答。[1]', label: '模拟回答', sources: [source] }
  }
  if (!sample || normalize(question) !== normalize(sample.prompt)) {
    return { text: '样例资料里没有找到支持这个问题的段落。可以试试页面下方的示例问题。', label: '模拟回答 · 未找到依据', sources: [] }
  }
  return { text: sample.answer, label: '模拟回答', sources: [demoMaterials(sample)[0]] }
}

async function sendQuestion(value) {
  const course = chatCourse()
  if (!course) return
  const info = dataFor(course)
  const question = value.trim()
  if (info.asking) return
  if (!question) {
    info.chatError = '请输入课程问题。'
    renderAssistant({ bottom: true, refresh: true })
    document.querySelector('#ask-input')?.focus()
    return
  }
  const session = state.session
  const active = () => state.session === session && chatCourse()?.id === course.id && assistantOpen
  info.asking = true
  info.chatError = ''
  renderAssistant({ bottom: true, refresh: true })
  try {
    let turn = demoAnswer(course, question)
    if (session) {
      const { data } = await api(apiPath(course, '/rag/ask'), { method: 'POST', body: { question }, timeout: 75_000 })
      const labels = {
        generated: '课程助手 · RAG 回答',
        retrieval_only: '课程助手 · 本次仅返回相关原文',
        no_evidence: '课程助手 · 未找到足够依据',
        sources_changed: '课程助手 · 资料已更新'
      }
      if (typeof data?.answer !== 'string') throw new Error('问答接口返回格式异常。')
      const citations = Array.isArray(data.citations) && data.citations.length ? data.citations
        : (Array.isArray(data.evidence) ? data.evidence.map(hit => hit.source) : [])
      turn = { text: data.answer, label: labels[data.status] || '课程助手', sources: citations.filter(source => source?.chunkId) }
    }
    info.chat.push({ question, ...turn })
    if (info.draft.trim() === question) info.draft = ''
  } catch (error) {
    info.chatError = error.message
  } finally {
    info.asking = false
    if (active()) renderAssistant({ bottom: true, refresh: true })
  }
}

function moveTodo(id, delta) {
  const { todos } = accountData()
  const index = todos.findIndex(item => item.id === id)
  const next = index + delta
  if (index < 0 || next < 0 || next >= todos.length) return
  const [item] = todos.splice(index, 1)
  todos.splice(next, 0, item)
  const up = next === todos.length - 1 || (next !== 0 && delta < 0)
  refreshTodos(saveAccount('已更新待办'), todoAction(up ? 'todo-up' : 'todo-down', id))
}

function libraryForViewer() {
  return personal.library.filter(item => item.owner === viewerId())
    .sort((first, second) => (second.updated || second.created) - (first.updated || first.created))
}

function libraryItem(id) {
  return personal.library.find(item => item.id === id && item.owner === viewerId())
}

function openLibrary() {
  return new Promise(resolve => {
    if (typeof indexedDB === 'undefined') return resolve()
    const request = indexedDB.open('campusai-prototype-library', 1)
    request.onupgradeneeded = () => request.result.createObjectStore('entries', { keyPath: 'id' })
    request.onerror = request.onblocked = () => resolve()
    request.onsuccess = () => {
      personal.db = request.result
      const records = personal.db.transaction('entries').objectStore('entries').getAll()
      records.onsuccess = () => {
        const ids = new Set(personal.library.map(item => item.id))
        personal.library.push(...records.result.filter(item => !ids.has(item.id)))
        const course = getCourse()
        if (course && state.route.tab === 'materials') refreshPersonalMaterials(course)
        if (drawer.open) renderDrawer()
        resolve()
      }
      records.onerror = () => resolve()
    }
  }).catch(() => {})
}

function storeEntry(entry, previous) {
  if (!personal.db) return Promise.resolve('unavailable')
  return new Promise(resolve => {
    try {
      const transaction = personal.db.transaction('entries', 'readwrite')
      const records = transaction.objectStore('entries')
      let result = 'saved'
      transaction.oncomplete = () => resolve(result)
      transaction.onabort = transaction.onerror = () => resolve('unavailable')
      if (previous && !previous.sessionOnly) {
        const request = records.get(entry.id)
        request.onsuccess = () => {
          const stored = request.result
          if (stored?.owner !== entry.owner || stored.updated !== previous.updated) result = 'conflict'
          else records.put(entry)
        }
      } else records.put(entry)
    } catch {
      resolve('unavailable')
    }
  })
}

  const filename = item && !isNote ? `<p class="small muted entry-file-note">当前文件 · ${esc(item.filename)}</p>` : ''
  const editingText = isNote || plainText !== null

      <label>${isNote ? '笔记标题' : item ? '资料名称' : '资料名称（可选）'}

      <label>归入课程 <select class="field" name="course-id">
        <option value="">未归入课程</option>${courses.map(course => `<option value="${esc(course.id)}"

      </select></label>
      <label>分类 <select class="field" name="category">${categories.map(category => `<option
        ${category === (item?.category || (isNote ? '课堂笔记' : '课件')) ? 'selected' : ''}>${category}</option>`).join('')}</select></label>
      ${editingText ? `<label>${isNote ? '笔记正文' : '文本内容'} <textarea class="field" name="text" rows="6" maxlength="12000" ${isNote ? 'required' : ''}></textarea></label>` : ''}
      ${isNote ? '' : `<label>${fileLabel} <input class="field" type="file" name="file"
        accept="${fileTypes.map(extension => '.' + extension).join(',')}" ${item ? '' : 'required'}></label>`}
      ${item && !isNote && !editingText ? '<p class="small muted">可修改名称、课程和分类，也可上传新版文件。</p>' : ''}

    const field = sheet.querySelector('[name="text"]')

  }

async function editEntry(key) {
  const entry = findEntry(key)
  if (entry?.source !== 'personal') return
  const owner = viewerId()
  await libraryReady
  if (viewerId() !== owner) return
  const item = libraryItem(entry.itemId)
  if (!item) return dialog('编辑个人资料', message('这条资料当前无法读取。', { error: true }))
  const courseId = String(item.courseId ?? '')
  if (item.kind === 'note' || !/\.(txt|md)$/i.test(item.filename) || item.blob.size > 48004) {
    return importEntry(item.kind, courseId, item)
  }
  const attempt = dialog('编辑个人资料', message('正在读取文本…'))
  let text = null
  try {
    const value = await item.blob.text()
    if (value.length <= 12000) text = value
  } catch {}
  if (sheet.open && attempt === sheetAction) importEntry(item.kind, courseId, item, text)
}

async function entryDraft(form, fields, previous) {
  const inputName = fields.get('name').trim()
  const textField = form.elements.namedItem('text')
  if (form.dataset.kind === 'note') {
    const text = textField.value.trim()
    if (!inputName) throw new Error('请输入笔记标题。')
    if (!text) throw new Error('请填写笔记正文。')
    if (text.length > 12000) throw new Error('一条笔记最多保存 12,000 字。')
    const suffix = /\.md$/i.test(previous?.filename || '') ? '.md' : '.txt'
    const filename = inputName.replace(/[\\/:*?"<>|]/g, '_') + suffix
    return { name: inputName, filename, text, blob: new Blob([text], { type: 'text/plain;charset=utf-8' }) }
  }
  const file = fields.get('file')
  const selected = file?.name ? file : null
  const baseName = selected?.name || previous?.filename || ''
  const extension = baseName.split('.').pop().toLowerCase()
  if (selected && (!fileTypes.includes(extension) || !selected.size || selected.size > 10 * 1024 * 1024)) {
    throw new Error('请使用支持的文件格式，文件大小需在 10 MB 以内。')
  }
  const name = inputName || (!previous && baseName)
  if (!name) throw new Error('请输入资料名称或选择文件。')
  let text = previous?.text || ''
  let blob = previous?.blob
  if (selected) {
    blob = selected
    text = /\.(txt|md)$/i.test(baseName) ? await selected.slice(0, 24000).text() : ''
  } else if (textField && textField.value !== textField.defaultValue) {
    text = textField.value
    blob = new Blob([text], { type: 'text/plain;charset=utf-8' })
  }
  if (!blob) throw new Error('请选择要上传的文件。')
  return { name, filename: baseName, text, blob }
}

async function saveImport(form) {
  const status = form.querySelector('.form-status')
  const submit = form.querySelector('[type="submit"]')
  const fields = new FormData(form)
  const kind = form.dataset.kind
  const courseId = fields.get('course-id')
  const course = courseId && courseById(courseId)
  const owner = viewerId()
  const attempt = sheetAction
  const active = () => sheet.open && attempt === sheetAction && viewerId() === owner
  submit.disabled = true
  try {
    await libraryReady
    if (!active()) return
    const previous = form.dataset.item ? libraryItem(form.dataset.item) : null
    if (form.dataset.item && !previous) throw new Error('这条资料当前无法编辑。')
    const draft = await entryDraft(form, fields, previous)
    if (!active()) return
    const now = Date.now()
    const item = {
      ...draft, id: previous?.id || newId(), owner, kind, category: fields.get('category'), courseId,
      courseName: course?.name || (courseId && courseId === previous?.courseId ? previous.courseName : ''),
      created: previous?.created || now, updated: Math.max(now, (previous?.updated || 0) + 1)
    }
    const result = await storeEntry(item, previous)
    if (result === 'conflict') throw new Error('这条资料在另一处已修改，请刷新后重新编辑。')
    if (result !== 'saved' && previous && !previous.sessionOnly) throw new Error('未能保存修改，原资料仍可查看。')
    item.sessionOnly = result !== 'saved'
    if (previous) personal.library[personal.library.indexOf(previous)] = item
    else personal.library.push(item)
    if (viewerId() !== owner) return
    const current = getCourse()
    if (current) refreshPersonalMaterials(current)
    if (drawer.open) renderDrawer()
    if (previous) refreshEntryReadings(item)
    const confirmation = item.sessionOnly ? '已保存到本次预览。浏览器存储不可用，刷新后将丢失。'
      : previous ? '已保存修改。' : '已保存到个人资料库。'
    announcement.textContent = confirmation
    if (!active()) return
    if (item.sessionOnly) status.textContent = confirmation
    else if (previous) {
      sheet.close()
      const surface = drawer.open ? drawer : currentReading() ? reader : app
      surface.querySelector('[data-action="edit-entry"][data-key="' + CSS.escape(localEntry(item).key) + '"]')?.focus({ preventScroll: true })
    } else showEntry(localEntry(item))
  } catch (error) {
    status.textContent = error.message
  } finally {
    submit.disabled = false
  }
}

const drawerSearchLabels = { favorites: '搜索收藏', library: '搜索个人资料' }

function groupedEntries(entries) {

  return groups.map(category => `<section class="drawer-content"><h3 class="label">${esc(category)}</h3>

}

  return accountData().favorites.map(entry => {

  })

function historyRows(items, action) {
  if (!items.length) return '<p class="notice">暂无记录。</p>'
  return items.map((item, index) => `<div class="history-item">
    <div><strong class="small">${esc(item.title)}</strong><p class="small muted">${esc(item.meta)}</p></div>
    <button type="button" class="btn outline compact" data-action="${action}" data-index="${index}" aria-label="查看 ${esc(item.title)}详情">详情</button>
  </div>`).join('')
}

function viewerFeedback() {
  return feedbackHistory.filter(item => {
    const owner = item.owner?.slice(0, item.owner.lastIndexOf(':'))
    return owner === viewerId() || (state.session && owner !== 'demo' && owner === state.session.user)
  })
}

function feedbackCourse(item) {
  const id = item.courseId ?? item.owner.split(':').pop()
  return item.courseName || state.courses.find(course => String(course.id) === String(id))?.name || '课程反馈'
}

function matchesDrawerQuery(view, ...fields) {
  const query = personal.drawerQueries[view]?.trim().toLocaleLowerCase()
  if (!query) return true
  const content = fields.join(' ').toLocaleLowerCase()
  return query.split(/\s+/).every(word => content.includes(word))
}

function drawerResults(view) {
  const filtered = Boolean(personal.drawerQueries[view]?.trim())
  const empty = '<p class="notice">没有找到匹配结果。</p>'
  if (view === 'favorites' || view === 'library') {
    const items = view === 'favorites' ? savedEntries() : libraryForViewer().map(localEntry)
    const matches = items.filter(entry => matchesDrawerQuery(view, entry.title, entry.name, entry.filename, entry.courseName,
      courseById(entry.courseId)?.courseCode, entry.category,
      entry.source === 'personal' ? libraryItem(entry.itemId)?.text : ''))
    return filtered && !matches.length ? empty : groupedEntries(matches)
  }
  return historyRows(viewerFeedback().map(item => ({
    title: feedbackCourse(item), meta: item.date + ' · ' + item.kind
  })), 'feedback-detail')
}

function renderDrawer() {
  const view = personal.drawerView
  const account = accountData()
  const searchLabel = drawerSearchLabels[view]
  const content = view === 'home' ? `<div class="identity"><span class="avatar large" aria-hidden="true">${avatarContent()}</span>
      <div><strong>${esc(account.profile.name)}</strong><p class="small muted">${state.session ? '学生账号' : '演示账号'}</p></div></div>

      </nav>` : `${searchLabel ? `<input type="search" id="drawer-search" class="field drawer-search" aria-label="${searchLabel}"

      <div id="drawer-results" class="drawer-content">${drawerResults(view)}</div>`
  drawer.innerHTML = `<div class="drawer-head">

async function login(form) {
  const submit = form.querySelector('button[type="submit"]')
  const status = form.querySelector('#login-status')
  const values = new FormData(form)
  const username = String(values.get('username')).trim()
  const password = String(values.get('password'))
  let token = ''
  submit.disabled = true
  status.textContent = '正在连接后端…'
  const attempt = sheetAction
  try {
    const loginResult = await api('/login', { method: 'POST', body: { username, password } })
    if (typeof loginResult.token !== 'string' || !loginResult.token) throw new Error('登录响应缺少令牌。')
    token = loginResult.token
    const [profile, courses] = await Promise.all([api('/getInfo', { token }), api('/campusai/courses', { token })])
    if (!profile.roles?.includes('student')) throw new Error('请使用学生账号。')
    if (!Array.isArray(courses.data)) throw new Error('课程接口返回格式异常。')
    if (!sheet.open || attempt !== sheetAction) {
      await api('/logout', { method: 'POST', token }).catch(() => {})
      return
    }
    state.session = { token, user: profile.user?.userName || username }
    state.courses = courses.data
    state.courseData.clear()
    state.query = ''
    personal.drawerQueries = {}
    personal.todoDraft = ''
    sheet.close()
    location.hash = '#/'
    route()
    announcement.textContent = '已连接真实后端'
  } catch (error) {
    if (token) await api('/logout', { method: 'POST', token }).catch(() => {})
    status.textContent = error.message
    submit.disabled = false
  }
}

async function disconnect() {
  const token = state.session?.token
  state.session = null
  state.courses = examples
  state.courseData.clear()
  state.query = ''
  personal.drawerQueries = {}
  personal.todoDraft = ''
  sheet.close()
  location.hash = '#/'
  route()
  announcement.textContent = '已返回演示数据'
  if (token) await api('/logout', { method: 'POST', token }).catch(() => {})
}

function findEntry(key) {
  const course = getCourse()
  const opened = currentReading()?.entry
  if (opened?.key === key) return opened
  return libraryForViewer().map(localEntry).find(item => item.key === key)
    || (course && publishedEntries(course, dataFor(course)).find(item => item.key === key))
    || accountData().favorites.find(item => item.key === key)
}

function entryContent(entry) {
  if (entry.source === 'personal') return libraryItem(entry.itemId)
  if (entry.source === 'demo') {
    const course = examples.find(item => String(item.id) === String(entry.courseId))
    return demoMaterials(course).find(item => item.id === entry.materialId)
  }
  return null
}

function renderReader() {
  const reading = currentReading()
  reader.hidden = !reading
  app.inert = Boolean(reading)
  document.querySelector('.top').inert = Boolean(reading)
  if (!reading) {
    reader.replaceChildren()
    return
  }
  reader.innerHTML = `<header class="reader-head">
    <button type="button" class="btn outline compact" data-action="close-reader">‹ 返回</button>
    <h2 id="reader-heading">${esc(reading.title)}</h2></header>`
  reader.append(reading.body)
  reading.body.scrollTop = reading.scroll || 0
}

function openReading(reading, html) {
  const previous = currentReading()
  if (previous) previous.scroll = previous.body.scrollTop
  reading.focusFrom = document.activeElement
  reading.body = document.createElement('div')
  reading.body.className = 'reader-body'
  reading.body.innerHTML = html
  if (drawer.open) {
    reading.returnDrawer = personal.drawerView
    drawer.close()
  }
  if (sheet.open) sheet.close()
  assistantOpen = false
  readings.push(reading)
  renderReader()
  renderAssistant()
  reader.querySelector('[data-action="close-reader"]')?.focus({ preventScroll: true })
}

function discardReading() {
  const reading = readings.pop()
  if (reading.url) URL.revokeObjectURL(reading.url)
  return reading
}

function closeReading() {
  if (!currentReading()) return
  const reading = discardReading()
  assistantOpen = false
  renderReader()
  renderAssistant()
  if (reading.returnDrawer) return showDrawer(reading.returnDrawer)
  if (reading.focusFrom?.isConnected) reading.focusFrom.focus({ preventScroll: true })
  else if (!launcher.hidden) launcher.focus({ preventScroll: true })
}

  const live = entry.source === 'live'
  return `${badge(live, live ? 'RAG 已发布资料' : entry.source === 'personal' ? '仅本机' : '演示资料')}

function showEntry(entry, citation = null) {
  const course = entry.courseId ? courseById(entry.courseId) : getCourse()
  const reading = { title: entry.title || entry.name, entry, course, citation }
  openReading(reading, entryReadingBody(reading))
  void preparePreview(reading)
}

function refreshEntryReadings(item) {
  const entry = localEntry(item)
  let refreshCurrent = false
  for (const [index, previous] of readings.entries()) {
    if (previous.entry?.key !== entry.key) continue
    if (previous.url) URL.revokeObjectURL(previous.url)
    const course = entry.courseId ? courseById(entry.courseId) : getCourse()
    const updated = { ...previous, title: entry.name, entry, course, url: null, pages: null, scroll: 0 }
    updated.body.innerHTML = entryReadingBody(updated)
    readings[index] = updated
    refreshCurrent ||= index === readings.length - 1
    void preparePreview(updated)
  }
  if (refreshCurrent) {
    renderReader()
    renderAssistant()
  }
}

function renderPreviewPage(reading, focusAction) {
  const target = reading.body.querySelector('.reader-preview')

function setPreviewPages(reading, pages, pageUnit, requested) {
  reading.pages = pages
  reading.pageUnit = pageUnit
  reading.pageIndex = Math.max(0, Math.min(requested || 0, pages.length - 1))

function textPreview(text, citation) {
  const first = citation?.paragraphStart || 0
  const last = citation?.paragraphEnd || first
  const lines = text.split(/\r?\n/)
  const html = first ? lines.map((line, index) => index + 1 >= first && index + 1 <= last
    ? `<span class="reader-highlight">${esc(line)}</span>` : esc(line)).join('\n') : esc(text)
  return `<div class="excerpt">${html}</div>`
}

// Only the XML parts needed for the content preview are read from Office ZIPs.
async function officeXml(blob, select) {
  const bytes = new Uint8Array(await blob.arrayBuffer())
  const view = new DataView(bytes.buffer)
  const decoder = new TextDecoder()
  let end = bytes.length - 22
  const earliest = Math.max(0, end - 65535)
  while (end >= earliest && view.getUint32(end, true) !== 0x06054b50) end--
  if (end < earliest) throw new Error('Office 文件损坏或已加密。')
  let offset = view.getUint32(end + 16, true)
  const count = view.getUint16(end + 10, true)
  if (count > 6000) throw new Error('此 Office 文件较复杂，请下载原件查看。')
  const parts = new Map()
  let total = 0
  for (let index = 0; index < count; index++) {
    if (offset + 46 > end || view.getUint32(offset, true) !== 0x02014b50) throw new Error('Office 文件目录无效。')
    const nameSize = view.getUint16(offset + 28, true)
    const name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameSize))
    const method = view.getUint16(offset + 10, true)
    const size = view.getUint32(offset + 20, true)
    const expected = view.getUint32(offset + 24, true)
    const local = view.getUint32(offset + 42, true)
    offset += 46 + nameSize + view.getUint16(offset + 30, true) + view.getUint16(offset + 32, true)
    if (!select.test(name)) continue
    total += expected
    if (expected > 4_000_000 || total > 12_000_000 || parts.size >= 100) throw new Error('内容过多，请下载原件查看。')
    if (local + 30 > end || view.getUint32(local, true) !== 0x04034b50) throw new Error('Office 文件内容无效。')
    const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true)
    if (start + size > end || (method !== 0 && method !== 8)) throw new Error('Office 压缩格式不受支持。')
    const data = bytes.subarray(start, start + size)
    let xml
    if (method === 0) {
      if (data.byteLength !== expected) throw new Error('Office 文件长度无效。')
      xml = decoder.decode(data)
    } else {
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
      const reader = stream.getReader()
      const decoded = new Uint8Array(expected)
      let written = 0
      while (true) {
        const { value, done } = await reader.read()
        if (done) break
        if (written + value.byteLength > expected) {
          await reader.cancel()
          throw new Error('Office 文件长度无效。')
        }
        decoded.set(value, written)
        written += value.byteLength
      }
      if (written !== expected) throw new Error('Office 文件解压不完整。')
      xml = decoder.decode(decoded)
    }
    if (/<!DOCTYPE/i.test(xml)) throw new Error('Office 文件含有不支持的声明。')
    const doc = new DOMParser().parseFromString(xml, 'application/xml')
    if (doc.querySelector('parsererror')) throw new Error('Office 文档结构无效。')
    parts.set(name, doc)
  }
  return parts
}

const xmlNodes = (node, name) => Array.from(node?.getElementsByTagNameNS('*', name) || [])
const xmlText = (node, name = 't') => xmlNodes(node, name).map(item => item.textContent).join('')
const officeRelationship = node => Array.from(node.attributes).find(attr => attr.localName === 'id' && attr.namespaceURI)?.value

function officeTargets(parts, folder, name, element) {
  const related = new Map(xmlNodes(parts.get(folder + '_rels/' + name + '.rels'), 'Relationship')
    .map(node => [node.getAttribute('Id'), node.getAttribute('Target')]))
  return xmlNodes(parts.get(folder + name), element).flatMap(node => {
    const target = related.get(officeRelationship(node))
    if (!target) return []
    const document = parts.get(target.startsWith('/') ? target.slice(1) : folder + target)
    return document ? [{ node, document }] : []
  })
}

function previewTable(rows) {
  return '<table><tbody>' + rows.map(row => '<tr>' + row.map(cell => '<td>' + esc(cell) + '</td>').join('') + '</tr>').join('') + '</tbody></table>'
}

async function officePreview(reading, blob, extension) {
  const { citation } = reading
  if (extension === 'docx') {
    const parts = await officeXml(blob, /^word\/document\.xml$/)
    const doc = parts.get('word/document.xml')
    if (!doc) throw new Error('没有找到 Word 正文。')
    const paragraphs = xmlNodes(xmlNodes(doc, 'body')[0], 'p').map(node => xmlText(node))
    return { html: textPreview(paragraphs.join('\n'), citation) }
  }
  if (extension === 'pptx') {
    const parts = await officeXml(blob, /^ppt\/(?:presentation\.xml|_rels\/presentation\.xml\.rels|slides\/slide\d+\.xml)$/)
    const ordered = officeTargets(parts, 'ppt/', 'presentation.xml', 'sldId')
    const slides = ordered.map(({ document: doc }) => {
      const shapes = [...(xmlNodes(doc, 'spTree')[0]?.children || [])]
      const html = shapes.map(shape => {
        const table = xmlNodes(shape, 'tbl')[0]
        if (table) return previewTable(xmlNodes(table, 'tr').map(row => xmlNodes(row, 'tc').map(cell => xmlText(cell))))
        return xmlNodes(shape, 'p').map(node => xmlText(node)).filter(Boolean).map(value => '<p>' + esc(value) + '</p>').join('')
      }).join('')
      return { html: `<div class="preview-page">${html || '<p class="muted">本页没有可提取的文字。</p>'}</div>` }
    })
    if (!slides.length) throw new Error('没有找到幻灯片。')
    return { pages: slides, unit: '张', index: citation?.slideNumber - 1 }
  }
  const parts = await officeXml(blob, /^xl\/(?:sharedStrings\.xml|workbook\.xml|_rels\/workbook\.xml\.rels|worksheets\/sheet\d+\.xml)$/)
  const shared = xmlNodes(parts.get('xl/sharedStrings.xml'), 'si').map(node => xmlText(node))
  const sheets = officeTargets(parts, 'xl/', 'workbook.xml', 'sheet').map(({ node: name, document: doc }) => {
    const rows = xmlNodes(doc, 'row').slice(0, 100).map(row => xmlNodes(row, 'c').slice(0, 25).map(cell => {
      const value = xmlText(cell, 'v')
      const type = cell.getAttribute('t')
      const display = type === 's' ? shared[Number(value)] : xmlText(cell) || value
      const address = cell.getAttribute('r') || ''
      return address + ' ' + (display ?? '')
    }))
    return { heading: name.getAttribute('name'), html: `<div class="preview-page">${previewTable(rows)}</div>` }
  })
  if (!sheets.length) throw new Error('没有找到工作表。')
  return { pages: sheets, unit: '表', index: sheets.findIndex(page => page.heading === citation?.sheetName) }
}

async function preparePreview(reading) {
  const target = reading.body.querySelector('.reader-preview')
  const { entry, citation } = reading
  const extension = (entry.filename || entry.name).split('.').pop().toLowerCase()
  try {
    if (entry.source === 'personal') await libraryReady
    const samples = entry.source === 'demo' && previewAssets[extension]
    if (samples?.length) {
      const unit = extension === 'pdf' ? '页' : '张'
      const pages = samples.map(image => ({ image }))
      setPreviewPages(reading, pages, unit, (citation?.pageNumber ?? citation?.slideNumber) - 1)
      return
    }
    const content = entryContent(entry)
    if (entry.source === 'personal' && !content) throw new Error('该资料当前未从本机资料库读取到。')
    if (entry.kind === 'note' || (entry.source === 'demo' && content?.text)) {
      target.innerHTML = textPreview(content?.text || '', citation)
      return
    }
    if (!['pdf', 'pptx', 'docx', 'xlsx', 'txt', 'md'].includes(extension)) {
      target.innerHTML = message('这个格式暂无法在 HTML 原型中预览。可下载原文件查看。')
      return
    }
    const blob = await entryBlob(entry)
    if (!readings.includes(reading)) return
    if (extension === 'pdf') {
      if (!(await blob.slice(0, 1024).text()).includes('%PDF-')) throw new Error('文件内容不符合 PDF 格式。')
      if (!readings.includes(reading)) return
      if (navigator.pdfViewerEnabled === false) throw new Error('当前浏览器未启用内嵌 PDF 查看器。可下载原文件查看。')
      reading.url = URL.createObjectURL(blob.slice(0, blob.size, 'application/pdf'))
      const frame = document.createElement('iframe')
      frame.className = 'reader-frame'
      frame.title = 'PDF 资料预览'
      frame.src = reading.url + '#page=' + (citation?.pageNumber || 1) + '&toolbar=0&view=FitH'
      target.replaceChildren(frame)
      return
    }
    if (extension === 'txt' || extension === 'md') {
      const text = await blob.slice(0, 160000).text()
      target.innerHTML = textPreview(text, citation) + (blob.size > 160000 ? '<p class="small muted">已显示文件开头，完整内容可下载查看。</p>' : '')
      return
    }
    const result = await officePreview(reading, blob, extension)
    if (result.pages) setPreviewPages(reading, result.pages, result.unit, result.index)
    else target.innerHTML = result.html
  } catch (error) {
    target.innerHTML = message(error.message || '资料暂时无法预览。', { error: true })
  }
}

function toggleFavorite(key) {
  const entry = findEntry(key)
  if (!entry) return
  const account = accountData()
  const existing = account.favorites.some(item => item.key === key)
  account.favorites = existing ? account.favorites.filter(item => item.key !== key) : [entry, ...account.favorites]
  const result = saveAccount(existing ? '已取消收藏' : '已加入收藏')
  const title = (existing ? '收藏 ' : '取消收藏 ') + entry.name
  for (const button of document.querySelectorAll('[data-action="favorite"]')) {
    if (button.dataset.key !== key) continue
    button.textContent = favoriteText(!existing, button.hasAttribute('data-icon'))
    button.setAttribute('aria-pressed', String(!existing))
    button.setAttribute('aria-label', title)
  }
  if (drawer.open && personal.drawerView === 'favorites') {
    const focusInDrawer = drawer.contains(document.activeElement)
    renderDrawer()
    if (focusInDrawer) drawer.querySelector('[data-action="drawer-view"]')?.focus()
  }
  announcement.textContent = result
}

async function entryBlob(entry) {
  const content = entryContent(entry)
  if (entry.source === 'personal') {
    if (!content) throw new Error('该资料当前未从本机资料库读取到。')
    return content.blob
  }
  if (entry.source === 'demo') {
    if (content?.text) return new Blob([content.text], { type: 'text/plain;charset=utf-8' })
    const asset = embeddedDocuments[content?.extension]
    if (asset) return new Blob([Uint8Array.from(atob(asset.base64), char => char.charCodeAt(0))], { type: asset.mime })
    throw new Error('格式样例不可用。')
  }
  const course = courseById(entry.courseId)
  if (!course || !state.session) throw new Error('请连接有权访问此课程的学生账号。')
  const path = '/rag/materials/' + encodeURIComponent(entry.materialId) + '/file?version=' + encodeURIComponent(entry.version)
  return api(apiPath(course, path), { file: true })
}

async function downloadEntry(button) {
  const reading = currentReading()
  const entry = reading?.entry
  if (!entry) return
  const status = reading.body.querySelector('[data-download-status]')
  const session = state.session
  button.disabled = true
  status.textContent = '正在读取文件…'
  try {
    const blob = await entryBlob(entry)
    if (session !== state.session || reading !== currentReading() || !button.isConnected) return
    const url = URL.createObjectURL(blob)
    const link = document.createElement('a')
    link.href = url
    link.download = entry.filename || entry.name
    link.click()
    setTimeout(() => URL.revokeObjectURL(url), 2000)
    status.textContent = '文件下载已开始。'
  } catch (error) {
    status.textContent = error.message
  } finally {
    button.disabled = false
  }
}

async function showSource(turnIndex, sourceIndex, openMaterial) {
  const course = chatCourse()
  const info = course && dataFor(course)
  const source = info?.chat[turnIndex]?.sources[sourceIndex]
  if (!source) return
  const previous = info.sourceView
  const sameSource = previous?.turn === turnIndex && previous?.index === sourceIndex
  if (!openMaterial && sameSource && previous.excerpt) {
    info.sourceView = null
    renderAssistant({ refresh: true })
    chatWindow.querySelector('[data-action="source"][data-turn="' + turnIndex + '"][data-index="' + sourceIndex + '"]')?.focus()
    return
  }
  const session = state.session
  const reading = currentReading()
  const inspection = { turn: turnIndex, index: sourceIndex, pending: Boolean(session) }
  info.sourceView = inspection
  const active = () => assistantOpen && state.session === session && chatCourse()?.id === course.id
    && reading === currentReading() && info.sourceView === inspection
  if (session) renderAssistant({ refresh: true })
  try {
    let confirmed = source
    if (session) {
      const { data } = await api(apiPath(course, '/rag/sources/' + encodeURIComponent(source.chunkId)))
      if (data?.chunkId !== source.chunkId || data.materialId !== source.materialId || data.version !== source.version || typeof data.text !== 'string') {
        throw new Error('引用资料已更新，请重新提问。')
      }
      confirmed = data
    }
    if (openMaterial && active()) {
      const file = session ? { ...confirmed, id: confirmed.materialId }
        : demoMaterials(mockFor(course.courseCode)).find(item => item.id === confirmed.id)
      if (!file) throw new Error('引用资料已更新，请重新提问。')
      showEntry(publishedEntry(course, file, session ? 'live' : 'demo'), confirmed)
    } else if (!openMaterial) {
      inspection.excerpt = confirmed.text
    }
  } catch (error) {
    inspection.error = error.message
  } finally {
    inspection.pending = false
    if (active()) {
      renderAssistant({ refresh: true })
      const action = openMaterial ? 'source-material' : 'source'
      chatWindow.querySelector('[data-action="' + action + '"][data-turn="' + turnIndex + '"][data-index="' + sourceIndex + '"]')?.focus()
    }
  }
}

function submitFeedback(course, info) {
  const result = mockApi['/mock/teacher-feedback'](feedbackOwner(course), course, info.feedbackKind, info.feedbackText)
  if (result.code !== 200) {
    info.feedbackError = result.msg
    info.feedbackSaved = ''
    render()
    document.querySelector('[name="feedback"]')?.focus()
    return
  }
  info.feedbackError = ''
  info.feedbackText = ''
  info.feedbackSaved = result.msg
  render()
}

document.addEventListener('input', event => {
  const field = event.target
  if (field.id === 'drawer-search') {
    personal.drawerQueries[personal.drawerView] = field.value
    drawer.querySelector('#drawer-results').innerHTML = drawerResults(personal.drawerView)
    return
  }
  if (field.name === 'question' && chatWindow.contains(field)) {
    const course = chatCourse()
    if (course) dataFor(course).draft = field.value
    return
  }
  if (field.name === 'todo') personal.todoDraft = field.value
  if (field.id === 'course-search') {
    state.query = field.value
    const results = courseCards()
    document.querySelector('#course-count').textContent = results.count + ' 门'
    document.querySelector('#course-grid').innerHTML = results.content
    return
  }
  const course = getCourse()
  if (!course || !app.contains(field)) return
  const info = dataFor(course)
  if (field.name === 'feedback') info.feedbackText = field.value
})

document.addEventListener('change', event => {
  const field = event.target
  if (field.name === 'todo-done') {
    const item = accountData().todos.find(todo => todo.id === field.value)
    if (item) {
      item.done = field.checked
      refreshTodos(saveAccount('已更新待办'), '[name="todo-done"][value="' + CSS.escape(item.id) + '"]')
    }
    return
  }
  const course = getCourse()
  if (!course || !app.contains(field)) return
  const info = dataFor(course)
  if (field.name === 'kind') info.feedbackKind = field.value
})

document.addEventListener('submit', event => {
  const form = event.target
  if (!form.dataset.form) return
  event.preventDefault()
  if (form.dataset.form === 'login') return void login(form)
  if (form.dataset.form === 'profile') return void saveProfile(form)
  if (form.dataset.form === 'import') return void saveImport(form)
  if (form.dataset.form === 'ask') return void sendQuestion(String(new FormData(form).get('question') || ''))
  if (form.dataset.form === 'edit-todo') return saveTodo(form)
  if (form.dataset.form === 'todo') {
    const value = personal.todoDraft.trim()
    if (!value) return
    accountData().todos.push({ id: newId(), text: value, done: false })
    personal.todoDraft = ''
    return refreshTodos(saveAccount('已更新待办'))
  }
  const course = getCourse()
  if (course && form.dataset.form === 'feedback') submitFeedback(course, dataFor(course))
})

document.addEventListener('click', event => {
  const button = event.target.closest('[data-action]')
  if (!button) return
  const action = button.dataset.action
  const index = Number(button.dataset.index)
  if (action === 'connection') return showConnection()
  if (action === 'close-dialog') return sheet.close()
  if (action === 'disconnect') return void disconnect()
  if (action === 'profile') return showDrawer()
  if (action === 'toggle-home') return toggleHomeSection(button)
  if (action === 'drawer-view') return showDrawer(button.dataset.view)
  if (action === 'edit-profile') return editProfile()
  if (action === 'open-chat' || action === 'minimize-chat') return setAssistant(action === 'open-chat')
  if (action === 'close-reader') return closeReading()
  if (action === 'ask-example') {
    const course = chatCourse()
    const prompt = button.dataset.example === 'citation' ? citationPrompt : course && mockFor(course.courseCode)?.prompt
    if (prompt) void sendQuestion(prompt)
    return
  }
  if (action === 'source' || action === 'source-material') {
    return void showSource(Number(button.dataset.turn), index, action === 'source-material')
  }
  if (action === 'previous-page' || action === 'next-page') {
    const reading = currentReading()
    if (!reading?.pages?.length) return
    const next = reading.pageIndex + (action === 'next-page' ? 1 : -1)
    if (next < 0 || next >= reading.pages.length) return
    reading.pageIndex = next
    renderPreviewPage(reading, action)
    return
  }
  if (action === 'feedback-detail') return showFeedbackDetail(index)
  if (action === 'import-file' || action === 'write-note') {
    return importEntry(action === 'write-note' ? 'note' : 'file', button.dataset.course)
  }
  if (action === 'favorite') return toggleFavorite(button.dataset.key)
  if (action === 'edit-entry') return void editEntry(button.dataset.key)
  if (action === 'open-entry') {
    const entry = findEntry(button.dataset.key)
    if (entry) showEntry(entry)
    return
  }
  if (action === 'download-entry') return void downloadEntry(button)
  if (action === 'todo-up' || action === 'todo-down') return moveTodo(button.dataset.key, action === 'todo-up' ? -1 : 1)
  if (action === 'edit-todo') return editTodo(button.dataset.key)
  if (action === 'remove-todo') {
    const account = accountData()
    account.todos = account.todos.filter(todo => todo.id !== button.dataset.key)
    sheet.close()
    return refreshTodos(saveAccount('已更新待办'))
  }
  const course = getCourse()
  if (!course) return
  const info = dataFor(course)
  if (action === 'reload-detail' || action === 'reload-materials') {
    info[action === 'reload-detail' ? 'detailsError' : 'materialsError'] = ''
    render()
    void loadCoursePage()
  }
})

sheet.addEventListener('close', () => {
  if (sheet.open) return
  sheetAction++
})
drawer.addEventListener('click', event => {
  if (event.target !== drawer) return
  const bounds = drawer.getBoundingClientRect()
  if (event.clientX < bounds.left || event.clientX >= bounds.right ||
      event.clientY < bounds.top || event.clientY >= bounds.bottom) drawer.close()
})
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || drawer.open || sheet.open) return
  if (assistantOpen) setAssistant(false)
  else if (currentReading()) closeReading()
})
window.addEventListener('hashchange', route)
const libraryReady = openLibrary()
route()
</script>
</body>
</html>
